<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso — CTL Manager</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="brand-mark">CTL</div>
    <span class="eyebrow">CTL MANAGER</span>
    <h1>Il tuo lavoro,<br><span>sempre sotto controllo.</span></h1>
    <p class="auth-copy">
      Inserisci il nome dell'autista per configurare il tuo spazio personale.
    </p>

    <form id="loginForm" class="panel form-panel">
      <label for="driverName">Nome autista</label>
      <input
        id="driverName"
        name="driverName"
        type="text"
        autocomplete="name"
        placeholder="Es. Francesco"
        required
      >
      <button class="btn btn-primary btn-wide" type="submit">
        Continua
      </button>
    </form>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("driverName").value.trim();

      if (!name) {
        return;
      }

      const data = CTLStorage.get();
      data.driverName = name;
      CTLStorage.save(data);

      window.location.href = "welcome.html";
    });
  </script>
</body>
</html>
