<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo — CTL Manager</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/parser.js"></script>
  <script src="../js/app.js"></script>
  <script>
    CTLApp.requireOnboarding();
    CTLApp.renderShell("profile");

    let data = CTLStorage.get();

    function renderProfile() {
      data = CTLStorage.get();

      const stats = Utils.stats(data.bookings);

      document.getElementById("pageContent").innerHTML = `
        <section class="page-title">
          <div>
            <span class="eyebrow">ACCOUNT</span>
            <h1>Profilo</h1>
            <p>Impostazioni, dati e sicurezza delle prenotazioni.</p>
          </div>
        </section>

        <section class="panel profile-card">
          <div class="profile-avatar">${Utils.initials(data.driverName)}</div>
          <div class="profile-main">
            <span class="eyebrow">AUTISTA</span>
            <h2>${Utils.escapeHtml(data.driverName)}</h2>
            <button class="text-btn" id="editDriver">
              <Pencil size="15"></Pencil>
              Modifica nome
            </button>
          </div>
        </section>

        <section class="section-head">
          <div>
            <span class="eyebrow">STATISTICHE</span>
            <h2>Contatore corse</h2>
          </div>
        </section>

        <div class="stats-grid">
          <div class="stat-card">
            <span>OGGI</span>
            <strong>${stats.day}</strong>
            <small>corse</small>
          </div>
          <div class="stat-card">
            <span>MESE</span>
            <strong>${stats.month}</strong>
            <small>corse</small>
          </div>
          <div class="stat-card">
            <span>ANNO</span>
            <strong>${stats.year}</strong>
            <small>corse</small>
          </div>
        </div>

        <section class="section-head">
          <div>
            <span class="eyebrow">ASPETTO</span>
            <h2>Tema app</h2>
          </div>
        </section>

        <div class="theme-grid">
          <button class="theme-option ${data.theme === "light" ? "active" : ""}" data-theme="light">
            <Sun size="19"></Sun>
            <span>Chiaro</span>
          </button>
          <button class="theme-option ${data.theme === "dark" ? "active" : ""}" data-theme="dark">
            <Moon size="19"></Moon>
            <span>Scuro</span>
          </button>
          <button class="theme-option ${data.theme === "system" ? "active" : ""}" data-theme="system">
            <Monitor size="19"></Monitor>
            <span>Sistema</span>
          </button>
        </div>

        <section class="section-head">
          <div>
            <span class="eyebrow">DATI LOCALI</span>
            <h2>Importa / esporta</h2>
          </div>
        </section>

        <div class="data-actions">
          <button class="btn btn-secondary" id="exportBtn">
            <Download size="18"></Download>
            Esporta dati
          </button>
          <button class="btn btn-secondary" id="importBtn">
            <Upload size="18"></Upload>
            Importa dati
          </button>
          <input id="importFile" type="file" accept="application/json" hidden>
        </div>

        <section class="section-head blacklist-heading">
          <div>
            <span class="eyebrow">CONTROLLO CLIENTI</span>
            <h2>Blacklist</h2>
            <p>Numero e motivazione sono obbligatori.</p>
          </div>
        </section>

        <form id="blacklistForm" class="panel form-panel">
          <label>
            Nome e cognome
            <input id="blackName" type="text" placeholder="Facoltativo">
          </label>

          <label>
            Numero di telefono *
            <input id="blackPhone" type="tel" inputmode="tel" placeholder="+39 333 1234567" required>
          </label>

          <label>
            Tratta
            <input id="blackRoute" type="text" placeholder="Facoltativo">
          </label>

          <label>
            Motivazione *
            <textarea id="blackReason" rows="3" placeholder="Motivo del blocco" required></textarea>
          </label>

          <button class="btn btn-danger btn-wide" type="submit">
            <ShieldAlert size="18"></ShieldAlert>
            Aggiungi alla blacklist
          </button>
        </form>

        <div class="blacklist-list">
          ${
            data.blacklist.length
            ? data.blacklist.map(item => `
              <article class="blacklist-item">
                <div class="blacklist-icon"><ShieldAlert size="19"></ShieldAlert></div>
                <div class="blacklist-info">
                  <strong>${Utils.escapeHtml(item.name || "Cliente senza nome")}</strong>
                  <span>${Utils.escapeHtml(Utils.prettyPhone(item.phone))}</span>
                  ${item.route ? `<small>${Utils.escapeHtml(item.route)}</small>` : ""}
                  <p>${Utils.escapeHtml(item.reason)}</p>
                </div>
                <button class="icon-btn danger-icon delete-black" data-id="${item.id}" title="Rimuovi">
                  <Trash2 size="17"></Trash2>
                </button>
              </article>
            `).join("")
            : `
              <div class="panel empty-state">
                <div class="empty-icon"><ShieldAlert size="24"></ShieldAlert></div>
                <strong>Blacklist vuota</strong>
                <span>Nessun cliente bloccato.</span>
              </div>
            `
          }
        </div>
      `;

      CTLApp.refreshIcons();
      bindProfileEvents();
    }

    function bindProfileEvents() {
      document.getElementById("editDriver").onclick = () => {
        const name = prompt("Nuovo nome autista:", data.driverName);

        if (name?.trim()) {
          data.driverName = name.trim();
          CTLStorage.save(data);
          renderProfile();
        }
      };

      document.querySelectorAll(".theme-option").forEach(button => {
        button.onclick = () => {
          data.theme = button.dataset.theme;
          CTLStorage.save(data);
          CTLApp.applyTheme();
          renderProfile();
        };
      });

      document.getElementById("exportBtn").onclick = () => {
        const payload = JSON.stringify(CTLStorage.get(), null, 2);
        const blob = new Blob([payload], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");

        anchor.href = url;
        anchor.download = `ctl-manager-backup-${Utils.today()}.json`;
        anchor.click();

        URL.revokeObjectURL(url);
      };

      document.getElementById("importBtn").onclick = () => {
        document.getElementById("importFile").click();
      };

      document.getElementById("importFile").onchange = async event => {
        const file = event.target.files[0];

        if (!file) return;

        try {
          const text = await file.text();
          const imported = JSON.parse(text);

          if (
            typeof imported !== "object" ||
            !Array.isArray(imported.bookings) ||
            !Array.isArray(imported.blacklist)
          ) {
            throw new Error("Formato non valido");
          }

          if (!confirm("Importare i dati? Quelli attuali verranno sostituiti.")) {
            return;
          }

          CTLStorage.save({
            ...CTLStorage.get(),
            ...imported
          });

          renderProfile();
        } catch {
          alert("Il file selezionato non è un backup CTL Manager valido.");
        }
      };

      document.querySelectorAll(".delete-black").forEach(button => {
        button.onclick = () => {
          if (!confirm("Rimuovere questo cliente dalla blacklist?")) return;

          const current = CTLStorage.get();

          current.blacklist = current.blacklist.filter(
            item => item.id !== button.dataset.id
          );

          CTLStorage.save(current);
          renderProfile();
        };
      });

      document.getElementById("blacklistForm").onsubmit = event => {
        event.preventDefault();

        const phone = document.getElementById("blackPhone").value.trim();
        const reason = document.getElementById("blackReason").value.trim();

        if (!phone || !reason) return;

        const current = CTLStorage.get();
        const normalized = Utils.normalizePhone(phone);

        const duplicate = current.blacklist.find(
          item => Utils.normalizePhone(item.phone) === normalized
        );

        if (duplicate) {
          alert("Questo numero è già presente nella blacklist.");
          return;
        }

        current.blacklist.push({
          id: Utils.uid(),
          name: document.getElementById("blackName").value.trim(),
          phone: normalized,
          route: document.getElementById("blackRoute").value.trim(),
          reason,
          createdAt: new Date().toISOString()
        });

        CTLStorage.save(current);
        renderProfile();
      };
    }

    renderProfile();
  </script>
</body>
</html>
