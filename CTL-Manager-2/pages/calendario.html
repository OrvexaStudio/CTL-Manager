<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario — CTL Manager</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/parser.js"></script>
  <script src="../js/app.js"></script>
  <script>
    CTLApp.requireOnboarding();
    CTLApp.renderShell("bookings");

    let current = new Date();
    current.setDate(1);

    function renderCalendar() {
      const data = CTLStorage.get();
      const year = current.getFullYear();
      const month = current.getMonth();

      const firstDay = new Date(year, month, 1).getDay();
      const mondayIndex = firstDay === 0 ? 6 : firstDay - 1;
      const days = new Date(year, month + 1, 0).getDate();

      const counts = {};

      data.bookings.forEach(item => {
        if (item.date) {
          counts[item.date] = (counts[item.date] || 0) + 1;
        }
      });

      const cells = [];

      for (let i = 0; i < mondayIndex; i++) {
        cells.push(`<div class="calendar-day muted"></div>`);
      }

      for (let day = 1; day <= days; day++) {
        const date = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const count = counts[date] || 0;
        const todayClass = date === Utils.today() ? " today" : "";

        cells.push(`
          <a class="calendar-day${todayClass}" href="prenotazioni.html">
            <span>${day}</span>
            ${count ? `<b>${count}</b>` : ""}
          </a>
        `);
      }

      document.getElementById("calendarContent").innerHTML = `
        <div class="calendar-head">
          <button class="icon-btn" id="prev"><ChevronLeft></ChevronLeft></button>
          <h2>${new Intl.DateTimeFormat("it-IT", { month: "long", year: "numeric" }).format(current)}</h2>
          <button class="icon-btn" id="next"><ChevronRight></ChevronRight></button>
        </div>

        <div class="calendar-week">
          <span>Lun</span>
          <span>Mar</span>
          <span>Mer</span>
          <span>Gio</span>
          <span>Ven</span>
          <span>Sab</span>
          <span>Dom</span>
        </div>

        <div class="calendar-grid">
          ${cells.join("")}
        </div>
      `;

      CTLApp.refreshIcons();

      document.getElementById("prev").onclick = () => {
        current.setMonth(current.getMonth() - 1);
        renderCalendar();
      };

      document.getElementById("next").onclick = () => {
        current.setMonth(current.getMonth() + 1);
        renderCalendar();
      };
    }

    document.getElementById("pageContent").innerHTML = `
      <section class="page-title">
        <div>
          <span class="eyebrow">AGENDA</span>
          <h1>Calendario</h1>
          <p>Il numero nel giorno indica le corse programmate.</p>
        </div>
        <a class="btn btn-secondary" href="prenotazioni.html">
          <ArrowLeft size="18"></ArrowLeft>
          Lista
        </a>
      </section>

      <section class="panel calendar-panel" id="calendarContent"></section>
    `;

    renderCalendar();
  </script>
</body>
</html>
