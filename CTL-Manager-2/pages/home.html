<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — CTL Manager</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/parser.js"></script>
  <script src="../js/app.js"></script>
  <script>
    CTLApp.requireOnboarding();
    CTLApp.renderShell("home");

    const data = CTLStorage.get();
    const today = Utils.today();
    const todayBookings = data.bookings
      .filter(item => item.date === today)
      .sort(Utils.compareBookings);

    const next = Utils.nextBooking(data.bookings);
    const hour = new Date().getHours();
    const greeting =
      hour < 5 ? "Buonanotte" :
      hour < 12 ? "Buongiorno" :
      hour < 18 ? "Buon pomeriggio" :
      "Buonasera";

    const app = document.getElementById("pageContent");

    app.innerHTML = `
      <section class="hero">
        <div>
          <span class="eyebrow">OGGI · ${Utils.formatLongDate(today)}</span>
          <h1>${Utils.escapeHtml(greeting)}, <span>${Utils.escapeHtml(data.driverName)}</span>.</h1>
          <p>Qui trovi tutto quello che ti serve per la giornata.</p>
        </div>
        <a class="avatar" href="profilo.html">${Utils.initials(data.driverName)}</a>
      </section>

      <section class="next-card">
        <div class="card-label">
          <span class="status-dot"></span>
          PROSSIMA CORSA
        </div>
        ${
          next
          ? `
            <div class="next-time">${Utils.escapeHtml(next.time || "Ora non impostata")}</div>
            <div class="route-line">
              <div>
                <small>PARTENZA</small>
                <strong>${Utils.escapeHtml(next.from || "Non impostata")}</strong>
              </div>
              <div class="route-arrow">→</div>
              <div>
                <small>DESTINAZIONE</small>
                <strong>${Utils.escapeHtml(next.to || "Non impostata")}</strong>
              </div>
            </div>
            <div class="next-footer">
              <span>
                ${next.name ? Utils.escapeHtml(next.name) : "Cliente senza nominativo"}
                ${next.passengers ? ` · ${next.passengers} pax` : ""}
              </span>
              ${
                next.phone
                ? `<a class="btn btn-call" href="tel:${Utils.escapeHtml(next.phone)}"><Phone size="17"> </Phone> Chiama</a>`
                : `<span class="no-phone">Nessun numero</span>`
              }
            </div>
          `
          : `
            <div class="empty-state compact">
              <div class="empty-icon"><CarFront size="24"></CarFront></div>
              <strong>Nessuna prossima corsa</strong>
              <span>Quando aggiungerai una prenotazione apparirà qui.</span>
            </div>
          `
        }
      </section>

      <section class="section-head">
        <div>
          <span class="eyebrow">PROGRAMMA</span>
          <h2>Le corse di oggi</h2>
        </div>
        <div class="counter">${todayBookings.length}</div>
      </section>

      <section class="booking-list">
        ${
          todayBookings.length
          ? todayBookings.map(booking => CTLApp.bookingRow(booking)).join("")
          : `
            <div class="panel empty-state">
              <div class="empty-icon"><CalendarDays size="24"></CalendarDays></div>
              <strong>Nessuna corsa oggi</strong>
              <span>La tua giornata è libera.</span>
            </div>
          `
        }
      </section>

      <a class="btn btn-primary btn-wide add-main" href="aggiungi-prenotazione.html">
        <Plus size="19"></Plus>
        Aggiungi prenotazione
      </a>
    `;

    CTLApp.refreshIcons();
  </script>
</body>
</html>
