<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenotazioni — CTL Manager</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/parser.js"></script>
  <script src="../js/app.js"></script>
  <script>
    CTLApp.requireOnboarding();
    CTLApp.renderShell("bookings");

    let filter = "all";
    let query = "";

    function renderBookings() {
      const data = CTLStorage.get();

      let list = [...data.bookings].sort(Utils.compareBookings);

      if (filter === "today") {
        list = list.filter(item => item.date === Utils.today());
      }

      if (filter === "upcoming") {
        list = list.filter(item => !item.date || item.date >= Utils.today());
      }

      if (query) {
        const q = query.toLowerCase();

        list = list.filter(item =>
          [
            item.name,
            item.phone,
            item.from,
            item.to,
            item.notes,
            item.date,
            item.time
          ].some(value => String(value || "").toLowerCase().includes(q))
        );
      }

      const groups = {};

      list.forEach(item => {
        const key = item.date || "no-date";
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });

      const content = document.getElementById("bookingContent");

      if (!list.length) {
        content.innerHTML = `
          <div class="panel empty-state">
            <div class="empty-icon"><Search size="24"></Search></div>
            <strong>Nessuna prenotazione trovata</strong>
            <span>Prova a cambiare ricerca o filtro.</span>
          </div>
        `;
        return;
      }

      content.innerHTML = Object.keys(groups)
        .sort((a, b) => {
          if (a === "no-date") return 1;
          if (b === "no-date") return -1;
          return a.localeCompare(b);
        })
        .map(date => `
          <section class="day-group">
            <div class="day-title">
              <div>
                <span>${date === "no-date" ? "DATA NON IMPOSTATA" : Utils.formatLongDate(date)}</span>
              </div>
              <b>${groups[date].length}</b>
            </div>

            <div class="booking-list">
              ${groups[date].map(booking => CTLApp.bookingRow(booking, true)).join("")}
            </div>
          </section>
        `)
        .join("");

      CTLApp.refreshIcons();
    }

    document.getElementById("pageContent").innerHTML = `
      <section class="page-title">
        <div>
          <span class="eyebrow">AGENDA</span>
          <h1>Prenotazioni</h1>
          <p>Tutte le corse programmate, in un unico posto.</p>
        </div>
        <a class="btn btn-secondary" href="calendario.html">
          <CalendarDays size="18"></CalendarDays>
          Calendario
        </a>
      </section>

      <div class="filters">
        <div class="search-box">
          <Search size="18"></Search>
          <input id="search" type="search" placeholder="Cerca cliente, telefono, indirizzo...">
        </div>

        <div class="filter-pills">
          <button class="filter active" data-filter="all">Tutte</button>
          <button class="filter" data-filter="today">Oggi</button>
          <button class="filter" data-filter="upcoming">Programmate</button>
        </div>
      </div>

      <div id="bookingContent"></div>
    `;

    document.getElementById("search").addEventListener("input", event => {
      query = event.target.value.trim();
      renderBookings();
    });

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        filter = button.dataset.filter;
        renderBookings();
      });
    });

    renderBookings();
  </script>
</body>
</html>
