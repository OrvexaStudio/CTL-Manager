<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiungi prenotazione — CTL Manager</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/parser.js"></script>
  <script src="../js/app.js"></script>
  <script>
    CTLApp.requireOnboarding();
    CTLApp.renderShell("add");

    let form = {
      name: "",
      phone: "",
      from: "",
      to: "",
      date: "",
      time: "",
      passengers: "",
      notes: ""
    };

    let sourceMode = "manual";
    let parsedText = "";

    document.getElementById("pageContent").innerHTML = `
      <section class="page-title">
        <div>
          <span class="eyebrow">NUOVA CORSA</span>
          <h1>Aggiungi prenotazione</h1>
          <p>Compila manualmente oppure usa voce o messaggio WhatsApp.</p>
        </div>
      </section>

      <div class="input-tabs">
        <button class="input-tab active" data-mode="manual">
          <Pencil size="17"></Pencil>
          Manuale
        </button>
        <button class="input-tab" data-mode="voice">
          <Mic size="17"></Mic>
          Voce
        </button>
        <button class="input-tab" data-mode="whatsapp">
          <MessageSquareText size="17"></MessageSquareText>
          WhatsApp
        </button>
      </div>

      <section class="panel smart-panel" id="smartPanel" hidden></section>

      <form id="bookingForm" class="form-grid">
        <div class="form-section">
          <div class="form-section-title">
            <span>01</span>
            Cliente
          </div>

          <label>
            Nome e cognome
            <input id="name" type="text" placeholder="Es. Mario Rossi">
          </label>

          <label>
            Numero di telefono
            <input id="phone" type="tel" inputmode="tel" placeholder="+39 333 1234567">
          </label>
        </div>

        <div class="form-section">
          <div class="form-section-title">
            <span>02</span>
            Percorso
          </div>

          <label>
            Indirizzo di partenza
            <input id="from" type="text" placeholder="Es. Stazione di Lecce">
          </label>

          <label>
            Indirizzo di arrivo
            <input id="to" type="text" placeholder="Es. Aeroporto di Brindisi">
          </label>
        </div>

        <div class="form-section">
          <div class="form-section-title">
            <span>03</span>
            Quando
          </div>

          <div class="two-cols">
            <label>
              Data
              <input id="date" type="date">
            </label>

            <label>
              Ora
              <input id="time" type="time">
            </label>
          </div>

          <label>
            Numero passeggeri
            <input id="passengers" type="number" min="1" max="99" placeholder="Es. 2">
          </label>
        </div>

        <div class="form-section">
          <div class="form-section-title">
            <span>04</span>
            Note
          </div>

          <label>
            Note extra
            <textarea id="notes" rows="4" placeholder="Seggiolino, valigie, esigenze particolari..."></textarea>
          </label>
        </div>

        <button class="btn btn-primary btn-wide" type="submit">
          <Save size="18"></Save>
          Salva prenotazione
        </button>
      </form>
    `;

    const fields = ["name", "phone", "from", "to", "date", "time", "passengers", "notes"];

    function syncForm() {
      fields.forEach(id => {
        document.getElementById(id).value = form[id] ?? "";
      });
    }

    function readForm() {
      fields.forEach(id => {
        form[id] = document.getElementById(id).value.trim();
      });
    }

    function showSmartPanel(title, text, mode) {
      const panel = document.getElementById("smartPanel");

      panel.hidden = false;
      panel.innerHTML = `
        <div class="smart-head">
          <div>
            <span class="eyebrow">${title}</span>
            <strong>${mode === "voice" ? "Dettatura in ascolto" : "Incolla il messaggio ricevuto"}</strong>
          </div>
          ${mode === "voice" ? `<button class="icon-btn" id="stopVoice"><MicOff size="18"></MicOff></button>` : ""}
        </div>

        ${
          mode === "whatsapp"
          ? `
            <textarea id="smartText" rows="7" placeholder="Incolla qui il messaggio WhatsApp del cliente...">${Utils.escapeHtml(text || "")}</textarea>
            <button type="button" class="btn btn-secondary btn-wide" id="analyzeText">
              <Check size="18"></Check>
              Analizza messaggio
            </button>
          `
          : `
            <div class="voice-status">
              <div class="pulse"></div>
              <span id="voiceText">${text || "Parla normalmente: puoi dire nome, telefono, partenza, destinazione, data e ora in qualsiasi ordine."}</span>
            </div>
          `
        }
      `;

      CTLApp.refreshIcons();

      if (mode === "whatsapp") {
        document.getElementById("analyzeText").onclick = analyzeSmartText;
      }

      if (mode === "voice") {
        document.getElementById("stopVoice").onclick = () => {
          if (window.ctlRecognition) {
            window.ctlRecognition.stop();
          }
        };
      }
    }

    function applyParsed(text) {
      const parsed = CTLParser.parse(text);

      form = {
        ...form,
        ...Object.fromEntries(
          fields.map(field => [field, parsed[field] !== undefined && parsed[field] !== "" ? parsed[field] : form[field]])
        )
      };

      parsedText = text;
      syncForm();

      const panel = document.getElementById("smartPanel");

      panel.innerHTML = `
        <div class="smart-result">
          <div class="smart-head">
            <div>
              <span class="eyebrow">DATI RICONOSCIUTI</span>
              <strong>Controlla prima di salvare</strong>
            </div>
            <button type="button" class="icon-btn" id="closeSmart"><X size="18"></X></button>
          </div>

          <div class="recognized-grid">
            <div><small>CLIENTE</small><b>${Utils.escapeHtml(form.name || "—")}</b></div>
            <div><small>TELEFONO</small><b>${Utils.escapeHtml(form.phone || "—")}</b></div>
            <div><small>PARTENZA</small><b>${Utils.escapeHtml(form.from || "—")}</b></div>
            <div><small>DESTINAZIONE</small><b>${Utils.escapeHtml(form.to || "—")}</b></div>
            <div><small>DATA</small><b>${Utils.escapeHtml(form.date ? Utils.formatDate(form.date) : "—")}</b></div>
            <div><small>ORA</small><b>${Utils.escapeHtml(form.time || "—")}</b></div>
            <div><small>PASSEGGERI</small><b>${Utils.escapeHtml(String(form.passengers || "—"))}</b></div>
            <div><small>NOTE</small><b>${Utils.escapeHtml(form.notes || "—")}</b></div>
          </div>

          <p class="smart-warning">
            Il sistema non salva automaticamente: verifica i campi qui sopra e poi premi “Salva prenotazione”.
          </p>
        </div>
      `;

      document.getElementById("closeSmart").onclick = () => {
        panel.hidden = true;
      };
    }

    function analyzeSmartText() {
      const text = document.getElementById("smartText").value.trim();

      if (!text) return;

      applyParsed(text);
    }

    function startVoice() {
      const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!Recognition) {
        alert(
          "La dettatura vocale non è supportata da questo browser. " +
          "Puoi usare l'inserimento manuale oppure incollare il messaggio WhatsApp."
        );
        return;
      }

      showSmartPanel("VOCE", "", "voice");

      const recognition = new Recognition();
      window.ctlRecognition = recognition;

      recognition.lang = "it-IT";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 5;

      recognition.onresult = event => {
        let transcript = "";

        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript + " ";
        }

        transcript = transcript.trim();

        const output = document.getElementById("voiceText");
        if (output) output.textContent = transcript;

        if (event.results[event.results.length - 1].isFinal) {
          applyParsed(transcript);
        }
      };

      recognition.onerror = event => {
        const output = document.getElementById("voiceText");

        if (output) {
          output.textContent =
            event.error === "not-allowed"
              ? "Permesso microfono negato."
              : "Non ho ricevuto una dettatura valida. Riprova.";
        }
      };

      recognition.onend = () => {
        window.ctlRecognition = null;
      };

      recognition.start();
    }

    document.querySelectorAll(".input-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".input-tab").forEach(item => item.classList.remove("active"));
        tab.classList.add("active");

        sourceMode = tab.dataset.mode;

        if (sourceMode === "manual") {
          document.getElementById("smartPanel").hidden = true;
        }

        if (sourceMode === "voice") {
          startVoice();
        }

        if (sourceMode === "whatsapp") {
          showSmartPanel("WHATSAPP", "", "whatsapp");
        }
      });
    });

    document.getElementById("bookingForm").addEventListener("submit", event => {
      event.preventDefault();

      readForm();

      const normalizedPhone = Utils.normalizePhone(form.phone);
      const data = CTLStorage.get();

      const blocked = CTLApp.findBlacklist(normalizedPhone);

      if (blocked) {
        CTLApp.showBlacklistConfirm(blocked, () => saveBooking());
        return;
      }

      saveBooking();
    });

    function saveBooking() {
      readForm();

      const data = CTLStorage.get();

      data.bookings.push({
        id: Utils.uid(),
        name: form.name,
        phone: Utils.normalizePhone(form.phone),
        from: form.from,
        to: form.to,
        date: form.date,
        time: form.time,
        passengers: form.passengers ? Number(form.passengers) : "",
        notes: form.notes,
        createdAt: new Date().toISOString()
      });

      CTLStorage.save(data);
      window.location.href = "prenotazioni.html";
    }
  </script>
</body>
</html>
