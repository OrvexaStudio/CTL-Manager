<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5f1eb"
    >

    <title>CTL Manager — Accesso</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body class="app-body login-page">

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-brand">
                <div class="auth-logo">
                    CTL
                </div>

                <div class="auth-brand-text">
                    <span class="auth-title">
                        CTL Manager
                    </span>

                    <span class="auth-subtitle">
                        Gestione professionale delle corse
                    </span>
                </div>
            </div>


            <div class="auth-content">

                <div class="auth-heading">
                    <span class="eyebrow">
                        Primo accesso
                    </span>

                    <h1>
                        Benvenuto
                    </h1>

                    <p>
                        Configuriamo il tuo profilo in pochi secondi.
                    </p>
                </div>


                <form
                    id="loginForm"
                    class="auth-form"
                    novalidate
                >

                    <div class="form-group">

                        <label
                            for="driverName"
                        >
                            Nome autista
                        </label>

                        <input
                            type="text"
                            id="driverName"
                            name="driverName"
                            class="form-input"
                            placeholder="Inserisci il tuo nome"
                            autocomplete="name"
                            maxlength="50"
                            required
                        >

                        <p
                            id="driverNameError"
                            class="form-error"
                            hidden
                        >
                            Inserisci il tuo nome per continuare.
                        </p>

                    </div>


                    <button
                        type="submit"
                        id="loginContinueButton"
                        class="primary-button auth-button"
                    >
                        Continua
                    </button>

                </form>

            </div>


            <footer class="auth-footer">
                <span>
                    CTL Manager
                </span>

                <span
                    aria-hidden="true"
                >
                    ·
                </span>

                <span>
                    Cooperativa Taxi Lecce
                </span>
            </footer>

        </section>

    </main>


    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>

    <script>
        (function () {
            "use strict";

            const Storage =
                window.CTLStorage;

            const Utils =
                window.CTLUtils;

            const form =
                document.getElementById(
                    "loginForm"
                );

            const driverNameInput =
                document.getElementById(
                    "driverName"
                );

            const error =
                document.getElementById(
                    "driverNameError"
                );

            const button =
                document.getElementById(
                    "loginContinueButton"
                );


            /*
             * Se il profilo è già stato configurato,
             * non mostriamo nuovamente il login.
             */
            if (
                Storage &&
                typeof Storage.hasCompletedLogin ===
                    "function" &&
                Storage.hasCompletedLogin()
            ) {
                window.location.replace(
                    "welcome.html"
                );

                return;
            }


            /*
             * Recupera eventualmente un nome già
             * digitato/salvato.
             */
            if (
                Storage &&
                typeof Storage.getProfile ===
                    "function"
            ) {
                const profile =
                    Storage.getProfile();

                if (
                    profile &&
                    profile.driverName
                ) {
                    driverNameInput.value =
                        profile.driverName;
                }
            }


            function showError() {
                error.hidden = false;

                driverNameInput.classList.add(
                    "input-error"
                );

                driverNameInput.focus();
            }


            function hideError() {
                error.hidden = true;

                driverNameInput.classList.remove(
                    "input-error"
                );
            }


            driverNameInput.addEventListener(
                "input",
                function () {
                    if (
                        Utils &&
                        typeof Utils.cleanText ===
                            "function"
                    ) {
                        driverNameInput.value =
                            driverNameInput.value
                                .replace(/\s+/g, " ");
                    }

                    if (
                        driverNameInput.value.trim()
                    ) {
                        hideError();
                    }
                }
            );


            form.addEventListener(
                "submit",
                function (event) {
                    event.preventDefault();

                    const driverName =
                        Utils &&
                        typeof Utils.capitalizeWords ===
                            "function"
                            ? Utils.capitalizeWords(
                                driverNameInput.value
                            )
                            : driverNameInput.value.trim();

                    if (!driverName) {
                        showError();
                        return;
                    }


                    button.disabled = true;
                    button.setAttribute(
                        "aria-busy",
                        "true"
                    );


                    try {
                        if (
                            Storage &&
                            typeof Storage.saveProfile ===
                                "function"
                        ) {
                            const currentProfile =
                                typeof Storage.getProfile ===
                                    "function"
                                    ? Storage.getProfile()
                                    : {};

                            Storage.saveProfile({
                                ...currentProfile,
                                driverName
                            });
                        }

                        window.location.href =
                            "welcome.html";

                    } catch (exception) {
                        console.error(
                            "Errore durante il salvataggio del profilo:",
                            exception
                        );

                        button.disabled = false;

                        button.removeAttribute(
                            "aria-busy"
                        );
                    }
                }
            );


            driverNameInput.focus();

        })();
    </script>

</body>
</html>
