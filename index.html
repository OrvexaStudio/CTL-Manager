<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5f1ea"
    >

    <meta
        name="description"
        content="CTL Manager - Gestione professionale delle prenotazioni della Cooperativa Taxi Lecce."
    >

    <title>CTL Manager</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e8a15d'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-size='48' font-family='Arial' font-weight='700' fill='white'%3ECTL%3C/text%3E%3C/svg%3E"
    >
</head>

<body>

    <main
        id="app"
        class="app-loader"
        aria-label="CTL Manager"
    >
        <div class="loader-content">

            <div class="loader-logo">
                CTL
            </div>

            <h1>
                CTL Manager
            </h1>

            <p>
                Gestione corse e prenotazioni
            </p>

            <div
                class="loader-spinner"
                aria-hidden="true"
            ></div>

        </div>
    </main>

    <script>
        (function () {
            "use strict";

            const STORAGE_KEY = "ctl_manager_profile";

            function getSavedProfile() {
                try {
                    const savedData = localStorage.getItem(STORAGE_KEY);

                    if (!savedData) {
                        return null;
                    }

                    const profile = JSON.parse(savedData);

                    if (
                        !profile ||
                        typeof profile !== "object" ||
                        typeof profile.driverName !== "string" ||
                        !profile.driverName.trim()
                    ) {
                        return null;
                    }

                    return profile;
                } catch (error) {
                    console.error(
                        "Errore durante il caricamento del profilo:",
                        error
                    );

                    return null;
                }
            }

            function redirect() {
                const profile = getSavedProfile();

                if (profile) {
                    window.location.replace("pages/home.html");
                    return;
                }

                window.location.replace("pages/login.html");
            }

            /*
             * Piccolo ritardo per evitare un passaggio visivo troppo brusco
             * durante il caricamento iniziale dell'app.
             */
            window.setTimeout(
                redirect,
                250
            );
        })();
    </script>

</body>
</html>
